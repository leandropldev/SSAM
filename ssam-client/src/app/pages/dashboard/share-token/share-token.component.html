<div class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center">
    <div class="relative p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-medium text-gray-800 mb-4">Share Token</h3>
        
        <form (ngSubmit)="onConfirm()" class="space-y-4">
            <div>
                <label for="parentId" class="block text-sm font-medium text-gray-700 mb-1">Parent Token ID</label>
                <input
                    type="text"
                    id="parentId"
                    [(ngModel)]="parentId"
                    name="parentId"
                    placeholder="Enter parent token ID"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    [disabled]="isLoading()"
                />
            </div>

            <div>
                <label for="friendEmail" class="block text-sm font-medium text-gray-700 mb-1">Friend's Email</label>
                <input
                    type="email"
                    id="friendEmail"
                    [(ngModel)]="friendEmail"
                    name="friendEmail"
                    placeholder="Enter friend's email"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    [disabled]="isLoading()"
                />
            </div>

            <div class="flex justify-end gap-3 pt-4">
                <button
                    type="button"
                    (click)="onCancel()"
                    [disabled]="isLoading()"
                    class="px-4 py-2 text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Cancel
                </button>
                <button
                    type="submit"
                    [disabled]="isLoading()"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    {{ isLoading() ? 'Sharing...' : 'Share Token' }}
                </button>
            </div>
        </form>
    </div>
</div>
