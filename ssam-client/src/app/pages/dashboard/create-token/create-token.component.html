<div class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
  <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
    <h3 class="text-lg font-medium text-gray-900 mb-4">Generate Parent Token</h3>
    
    <form (ngSubmit)="onConfirm()" class="space-y-4">
      <div>
        <label for="ownerId" class="block text-sm font-medium text-gray-700 mb-1">
          Owner ID
        </label>
        <input
          id="ownerId"
          type="text"
          [ngModel]="ownerId()"
          (ngModelChange)="ownerId.set($event)"
          name="ownerId"
          required
          [disabled]="isLoading()"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
          placeholder="Enter owner ID"
        />
      </div>

      <div>
        <label for="confidentialData" class="block text-sm font-medium text-gray-700 mb-1">
          Confidential Data
        </label>
        <textarea
          id="confidentialData"
          [ngModel]="confidentialData()"
          (ngModelChange)="confidentialData.set($event)"
          name="confidentialData"
          required
          [disabled]="isLoading()"
          rows="4"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
          placeholder="Enter confidential data"
        ></textarea>
      </div>

      <div class="flex justify-end space-x-3 pt-4">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isLoading()"
          class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="isLoading()"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isLoading() ? 'Loading...' : 'Confirm' }}
        </button>
      </div>
    </form>
  </div>
</div>
